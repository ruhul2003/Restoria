<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-[#F6F5F5]">
    <header>
      <nav class="flex flex-row justify-around items-center h-24 bg-white shadow-md">
        <div class="text-4xl text-[#35CD8C] font-bold p-5">Restoria</div>
        <ul class="flex flex-row gap-8 justify-center ">
          <li><a class="text-lg font-bold text-[#35CD8C]" href="#">Home</a></li>
          <li><a class="text-lg font-bold" href="#">About</a></li>
          <li><a class="text-lg font-bold" href="#">Food</a></li>
          <li><a class="text-lg font-bold" href="#">Gallery</a></li>
          <li><a class="text-lg font-bold" href="#">Chefs</a></li>
          <li><a class="text-lg font-bold" href="#">Contact</a></li>
        </ul>
        <button class="bg-[#35CD8C] text-white text-lg px-6 py-2 border-2 border-[#35CD8C] rounded-full hover:bg-white hover:text-[#35CD8C] hover:cursor-pointer">Reservation</button>

        <div class="flex flex-row gap-5">
          <i class="fa-brands fa-facebook-f text-2xl text-[#35CD8C] hover:cursor-pointer"></i>
          <i class="fa-brands fa-twitter text-2xl text-[#35CD8C] hover:cursor-pointer"></i>
          <i class="fa-brands fa-instagram text-2xl text-[#35CD8C] hover:cursor-pointer"></i>
        </div>
      </nav>

      <div class="flex flex-row gap-6 justify-center items-center mt-7 relative">
        <div>
          <h1 class="text-8xl font-bold text-[#251F56]">The Delicious <br> Food House</h1>
          <p class="text-black mt-6">Baume is a restaurant, bar and coffee roastery located on London. We have awesome <br> recipes and the most talented chefs in town.</p>

          <div class="flex flex-row gap-7 mt-9">
            <button class="bg-[#35CD8C] text-white text-lg px-6 py-2 border-2 border-[#35CD8C] rounded-full hover:bg-white hover:text-[#35CD8C] hover:cursor-pointer">Discover Menu</button>

            <button class="ml-4 bg-white text-[#35CD8C] text-lg px-6 py-2 border-2 border-[#35CD8C] rounded-full hover:bg-[#35CD8C] hover:text-white hover:cursor-pointer">Contact</button>
          </div>
        </div>

        <div>
          <img src="./Images/banner-thumb.png" alt="">
        </div>

        <img class="absolute top-9 left-0" src="./Images/chiley.png" alt="">
      </div>
    </header>
  </body>
</html>
